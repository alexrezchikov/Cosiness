<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Кофейня Cosiness — Корзина</title>
    <link rel="stylesheet" href="css/style.css"/>
  </head>
  <body>
    <header>
      <div class="logo">☕ Кафе «Уют»</div>
      <nav>
        <a href="index.html">Главная</a>
        <a href="menu.html">Меню</a>
        <a href="about.html">О нас</a>
        <a href="gallery.html">Галерея</a>
        <a href="contacts.html">Контакты</a>
        <a href="cart.html" class="active">Корзина</a>
        <a href="profile.html">Профиль</a>
      </nav>
    </header>

    <main>
      <h2>Корзина</h2>

      <div class="cart-layout">
        <section class="cart-items fade-in-up" id="cartItems"></section>

        <aside class="cart-summary fade-in-up">
          <h3>Итого</h3>
          <div id="summaryBody"></div>
          <button type="button" class="checkout-btn" id="checkoutBtn">Оформить заказ</button>
          <a href="menu.html" class="continue-link">← Продолжить выбор</a>
        </aside>
      </div>
    </main>

    <footer>
      <p>&copy; 2026 Кафе «Уют». Все права защищены.</p>
      <p>Адрес: г. Москва, ул. Патриаршские пруды, д. 1 • Телефон: +7 (925) 119-90-15</p>
      <p>&copy; ООО "Мама Птица"</p>
    </footer>

    <script>
      const CART_KEY = 'cosiness_cart';

      function getCart() {
        try { return JSON.parse(localStorage.getItem(CART_KEY)) || {}; }
        catch (e) { return {}; }
      }

      function saveCart(cart) {
        localStorage.setItem(CART_KEY, JSON.stringify(cart));
        renderCart();
        updateCartBadge();
      }

      function updateCartBadge() {
        const cart = getCart();
        const totalQty = Object.values(cart).reduce((s, i) => s + i.qty, 0);
        const link = document.querySelector('nav a[href="cart.html"]');
        if (!link) return;
        link.classList.toggle('cart-filled', totalQty > 0);
        let badge = link.querySelector('.cart-badge');
        if (totalQty > 0) {
          if (!badge) { badge = document.createElement('span'); badge.className = 'cart-badge'; link.appendChild(badge); }
          badge.textContent = totalQty;
        } else if (badge) badge.remove();
      }

      const EMOJI = {
        'espresso': '☕', 'americano': '☕', 'cappuccino': '☕', 'latte': '☕',
        'flatwhite': '☕', 'raf': '☕', 'cocoa': '🍫', 'seabuckthorn': '🍵',
        'croissant-almond': '🥐', 'croissant-choc': '🥐', 'cinnabon': '🥮',
        'muffin': '🧁', 'sandwich-turkey': '🥪', 'sandwich-salmon': '🥪',
        'oatmeal': '🥣', 'syrniki': '🥞', 'avocado': '🥗', 'caesar': '🥗',
        'greek': '🥗', 'tuna': '🥗', 'cheesecake': '🍰', 'tiramisu': '🍰',
        'brownie': '🍫', 'medovik': '🍰', 'pannacotta': '🍮', 'icecream': '🍦'
      };

      function renderCart() {
        const cart = getCart();
        const itemsEl = document.getElementById('cartItems');
        const summaryBody = document.getElementById('summaryBody');
        const checkoutBtn = document.getElementById('checkoutBtn');
        const ids = Object.keys(cart);
        const totalQty = ids.reduce((s, id) => s + cart[id].qty, 0);
        const subtotal = ids.reduce((s, id) => s + cart[id].price * cart[id].qty, 0);

        if (ids.length === 0) {
          itemsEl.innerHTML = `
            <div class="cart-empty">
              <div class="cart-empty-icon">🛒</div>
              <h3>Корзина пуста</h3>
              <p>Загляните в меню — там много вкусного.</p>
              <a href="menu.html" class="checkout-btn" style="display:inline-block; width:auto; padding:0.8rem 2rem; text-decoration:none;">Перейти в меню</a>
            </div>`;
          summaryBody.innerHTML = `
            <div class="summary-row"><span>Товары (0)</span><span>0 ₽</span></div>
            <hr>
            <div class="summary-row summary-total"><span>К оплате</span><span>0 ₽</span></div>`;
          checkoutBtn.disabled = true;
          return;
        }

        itemsEl.innerHTML = ids.map((id) => {
          const item = cart[id];
          return `
            <div class="cart-item" data-id="${id}">
              <div class="cart-thumb">${EMOJI[id] || '🍽️'}</div>
              <div class="cart-info">
                <h3>${item.name}</h3>
                <div class="cart-qty">
                  <button type="button" class="qty-btn" data-action="minus">−</button>
                  <span>${item.qty}</span>
                  <button type="button" class="qty-btn" data-action="plus">+</button>
                </div>
              </div>
              <span class="dish-price">${item.price * item.qty} ₽</span>
            </div>`;
        }).join('');

        const discount = Math.round(subtotal * 0.05);
        const total = subtotal - discount;

        summaryBody.innerHTML = `
          <div class="summary-row"><span>Товары (${totalQty})</span><span>${subtotal} ₽</span></div>
          <div class="summary-row"><span>Скидка постоянного гостя</span><span>−${discount} ₽</span></div>
          <div class="summary-row"><span>Доставка</span><span>0 ₽</span></div>
          <hr>
          <div class="summary-row summary-total"><span>К оплате</span><span>${total} ₽</span></div>`;
        checkoutBtn.disabled = false;

        itemsEl.querySelectorAll('.cart-item').forEach((row) => {
          const id = row.dataset.id;
          row.querySelectorAll('.qty-btn').forEach((btn) => {
            btn.addEventListener('click', () => {
              const c = getCart();
              if (!c[id]) return;
              if (btn.dataset.action === 'plus') c[id].qty++;
              else {
                c[id].qty--;
                if (c[id].qty <= 0) delete c[id];
              }
              saveCart(c);
            });
          });
        });
      }

      document.getElementById('checkoutBtn').addEventListener('click', () => {
        if (Object.keys(getCart()).length === 0) return;
        alert('Спасибо! Заказ оформлен. Мы свяжемся с вами.');
        localStorage.removeItem(CART_KEY);
        renderCart();
        updateCartBadge();
      });

      const observerOptions = { root: null, rootMargin: '0px', threshold: 0.1 };
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
      }, observerOptions);
      document.querySelectorAll('.fade-in-up').forEach(el => observer.observe(el));

      renderCart();
      updateCartBadge();
    </script>
  </body>
</html>
