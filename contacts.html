<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cosiness | Contacts</title>
    <link rel="stylesheet" href="css/style.css"/>
  </head>
  <body>
    <header>
      <a href="index.html" class="logo logo-img" aria-label="На главную">
        <img src="images/coffee_bean.png" alt="Логотип кафе Уют">
      </a>
      <nav>
        <a href="index.html">Главная</a>
        <a href="menu.html">Меню</a>
        <a href="about.html">О нас</a>
        <a href="gallery.html">Галерея</a>

        <a href="profile.html">Профиль</a>
      </nav>
    </header>
    <main>
      <h2>Свяжитесь с нами</h2>
      <form id="contactForm">
        <label for="name">Ваше имя</label>
        <input type="text" id="name" name="name" required placeholder="Андрей Бурим">
        <label for="phone">Телефон</label>
        <input type="tel" id="phone" name="phone" required placeholder="+7 (999) 000-00-00">
        <label for="message">Сообщение</label>
        <textarea id="message" name="message" rows="4" placeholder="Хочу забронировать столик..."></textarea>
        <button type="submit">Отправить</button>
      </form>
    </main>
    <div class="toast" id="toast">Сообщение отправлено</div>
    <footer>
      <p>&copy; 2026 Кафе «Уют». Все права защищены.</p>
      <p>Адрес: г. Москва, ул. Патриаршские пруды, д. 1 • Телефон: +7 (925) 119-90-15</p>
      <p>&copy; ООО "Мама Птица"</p>
    </footer>
    <script src="js/contacts.js"></script>
