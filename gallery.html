<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Кофейня Cosiness — Галерея</title>
    <link rel="stylesheet" href="css/style.css"/>
  </head>
  <body>
    <header>
      <div class="logo">☕ Кафе «Уют»</div>
      <nav>
        <a href="index.html">Главная</a>
        <a href="menu.html">Меню</a>
        <a href="about.html">О нас</a>
        <a href="gallery.html" class="active">Галерея</a>
        <a href="contacts.html">Контакты</a>
      </nav>
    </header>

    <main>
      <h2>Галерея</h2>
        <div class="gallery-grid">
          <figure class="photo-card fade-in-up">
            <img src="images/interier.jpg" alt="Интерьер кафе">
            <figcaption>Уютный интерьер и мягкие кресла</figcaption>
          </figure>

          <figure class="photo-card fade-in-up">
            <img src="images/coffe.jpg" alt="Кофе">
            <figcaption>Ароматный капучино</figcaption>
          </figure>

          <figure class="photo-card fade-in-up team-card">
            <img src="images/motherbossbird.png" alt="Команда">
            <figcaption>Наша дружная команда</figcaption>
          </figure>

          <figure class="photo-card fade-in-up">
            <img src="images/desert.jpg" alt="Десерты">
            <figcaption>Десерты от нашего кондитера</figcaption>
          </figure>
        </div>
    </main>

    <footer>
      <p>&copy; 2026 Кафе «Уют». Все права защищены.</p>
      <p>Адрес: г. Москва, ул. Патриаршские пруды, д. 1 • Телефон: +7 (925) 119-90-15</p>
      <p>&copy; ООО "Мама Птица"</p>
    </footer>

    <script>
      const observerOptions = {
        root: null,
        rootMargin: '0px',
        threshold: 0.1
      };

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
          }
        });
      }, observerOptions);

      document.querySelectorAll('.fade-in-up').forEach(el => {
        observer.observe(el);
      });
    </script>
  </body>
</html>
